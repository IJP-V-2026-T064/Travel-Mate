spring.application.name=travelmate

# Server Configuration
server.port=8080

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Replace YOUR_DATABASE_NAME with your actual MySQL database name (e.g. travelmate_db)
spring.datasource.url=jdbc:mysql://localhost:3306/YOUR_DATABASE_NAME?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Replace YOUR_MYSQL_USERNAME with your MySQL username (e.g. root)
spring.datasource.username=YOUR_MYSQL_USERNAME

# Replace YOUR_MYSQL_PASSWORD with your MySQL password
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# Automatically validate or update tables (keeps existing data and updates schema)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console for learning and debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

